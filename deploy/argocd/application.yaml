apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kleinanzeigen-monitor
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/friedrichtroescher/kleinanzeigen-monitor.git
    targetRevision: main
    path: deploy/kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: kleinanzeigen-monitor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
